<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Grid - Flexbox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    h1 {
      margin: 28px 20px 8px;
      text-align: center;
    }

    .intro {
      margin: 0 20px 12px;
      text-align: center;
      color: #64748b;
    }

    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      flex: 1 1 calc(25% - 20px);
      min-width: 220px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card h4 {
      margin-top: 0;
    }

    .price {
      margin-bottom: 0;
      color: #0f766e;
      font-weight: bold;
    }

    @media (prefers-reduced-motion: reduce) {
      .product-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <h1>Danh sách sản phẩm</h1>
  <p class="intro">Bố cục tự động co giãn với Flexbox</p>

  <div class="product-grid">
    <div class="product-card">
      <h4>Sản phẩm 1</h4>
      <p class="price">500.000 đ</p>
    </div>
    <div class="product-card">
      <h4>Sản phẩm 2</h4>
      <p class="price">750.000 đ</p>
    </div>
    <div class="product-card">
      <h4>Sản phẩm 3</h4>
      <p class="price">1.200.000 đ</p>
    </div>
    <div class="product-card">
      <h4>Sản phẩm 4</h4>
      <p class="price">320.000 đ</p>
    </div>
  </div>
</body>
</html>
